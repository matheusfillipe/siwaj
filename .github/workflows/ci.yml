name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: make install
      - run: make ci-host-checks

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          ldproxy: true
          version: 1.95.0.0
      # the prebuilt QEMU fork links SDL2 even when it runs headless
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libslirp0 libpixman-1-0
      # the xtensa action brings espup and ldproxy but not espflash, and
      # building it from source costs more than fetching the release binary
      - name: Install cargo-espflash
        run: |
          curl -sSLo /tmp/cargo-espflash.zip \
            https://github.com/esp-rs/espflash/releases/download/v4.5.0/cargo-espflash-x86_64-unknown-linux-gnu.zip
          unzip -oq /tmp/cargo-espflash.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/cargo-espflash"
          cargo espflash --version
      - uses: actions/cache@v6
        with:
          path: |
            firmware/.embuild
            firmware/target
            firmware/target-esp32
          key: esp32-${{ runner.os }}-${{ hashFiles('firmware/Cargo.lock') }}
      - run: make install
      - run: make ci-emulator-tests
