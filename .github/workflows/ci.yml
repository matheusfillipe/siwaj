name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: make install
      - run: make ci-host-checks

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: esp-rs/xtensa-toolchain@v1
        with:
          ldproxy: true
          version: 1.95.0.0
      - uses: actions/cache@v6
        with:
          path: |
            firmware/.embuild
            firmware/target
            firmware/target-esp32
          key: esp32-${{ runner.os }}-${{ hashFiles('firmware/Cargo.lock') }}
      - run: make install
      - run: make ci-emulator-tests
