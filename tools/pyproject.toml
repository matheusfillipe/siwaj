[project]
name = "siwaj-tools"
version = "0.0.0"
description = "siwaj local harness: serial provisioner, QEMU runner, snapshot checks"
requires-python = ">=3.12"
dependencies = [
    "pyserial==3.5",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "pytest==9.1.1",
    "pre-commit==4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siwaj_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
