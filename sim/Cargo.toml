[package]
name = "siwaj-sim"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Host-side simulation harness for siwaj: the SDL display mirror and the render preview"

[dependencies]
siwaj-core = { path = "../core", features = ["preview"] }
embedded-graphics = "0.8.2"
embedded-graphics-simulator = { version = "0.8.0", optional = true }

[features]
# SDL2 is a link-time dependency the host has and CI does not, so the windows
# are opt-in and `cargo test --workspace` skips them
sdl = ["dep:embedded-graphics-simulator"]

[[bin]]
name = "mirror"
required-features = ["sdl"]

[[bin]]
name = "preview"
required-features = ["sdl"]
