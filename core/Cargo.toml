[package]
name = "siwaj-core"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Shared config types, decision logic, and TS bindings for siwaj"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
embedded-graphics = "0.8.2"

[features]
# lets a host tool rebuild a frame from the bytes the device hands out; the
# device only ever packs frames, so this stays out of firmware builds
preview = []
