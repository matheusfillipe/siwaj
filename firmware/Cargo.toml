[package]
name = "siwaj-firmware"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[[bin]]
name = "siwaj"
path = "src/main.rs"
harness = false

[profile.release]
opt-level = "s"

# Xtensa LLVM ICE at opt-level="s" on serde f32 constant pools; 2 codegens it fine
[profile.release.package.siwaj-core]
opt-level = 0

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
siwaj-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[build-dependencies]
embuild = "0.33"

[workspace]
