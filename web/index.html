<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>siwaj</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>siwaj</h1>
      <p class="subtitle">should i wear a jacket</p>
    </header>

    <div id="banner" class="banner hidden">First setup: pick your city and comfort thresholds, then save.</div>
    <p id="status" class="status" role="status"></p>

    <form id="config-form">
      <label for="city">City</label>
      <input id="city" name="city" type="text" autocomplete="address-level2" placeholder="Berlin" required>

      <fieldset>
        <legend>What to wear, by feels-like &deg;C</legend>

        <div id="bands" class="bands" aria-hidden="true">
          <div class="band" data-band="jacket"><span class="band-name">jacket</span><span class="band-range" id="bandJacket"></span></div>
          <div class="band" data-band="pullover"><span class="band-name">pullover</span><span class="band-range" id="bandPullover"></span></div>
          <div class="band" data-band="shirt"><span class="band-name">shirt</span><span class="band-range" id="bandShirt"></span></div>
          <div class="band" data-band="tshirt"><span class="band-name">t-shirt</span><span class="band-range" id="bandTshirt"></span></div>
        </div>

        <div class="slider">
          <label for="low">jacket below <output id="lowOut" for="low"></output></label>
          <input id="low" name="low" type="range" min="-10" max="30" step="0.5" required>
        </div>
        <div class="slider">
          <label for="mid">pullover below <output id="midOut" for="mid"></output></label>
          <input id="mid" name="mid" type="range" min="-10" max="30" step="0.5" required>
        </div>
        <div class="slider">
          <label for="high">shirt below <output id="highOut" for="high"></output></label>
          <input id="high" name="high" type="range" min="-10" max="30" step="0.5" required>
        </div>
      </fieldset>

      <div class="slider">
        <label for="rain">Rain streaks from <output id="rainOut" for="rain"></output></label>
        <input id="rain" name="rain" type="range" min="0" max="100" step="5" required>
      </div>

      <label for="refresh">Refresh interval</label>
      <select id="refresh" name="refresh" required>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
        <option value="120">120 min</option>
      </select>

      <button id="save" type="submit">Save</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
