<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>siwaj</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <header>
      <svg class="mark" viewBox="0 0 110 84" role="img" aria-label="siwaj">
        <g fill="currentColor">
          <path d="M30 8h25v5l-3 19v48H30z"/>
          <path d="M80 8H55v5l3 19v48h22z"/>
          <path d="M30 9h8L14 52 5 46z"/>
          <path d="M80 9h-8l24 43 9-6z"/>
        </g>
      </svg>
      <h1>siwaj</h1>
      <p class="subtitle">should i wear a jacket</p>
    </header>

    <p id="awake" class="awake" role="status"></p>

    <div id="banner" class="banner hidden">First setup: pick your city and comfort thresholds, then save.</div>
    <p id="status" class="status" role="status"></p>

    <form id="config-form">
      <label for="city">City</label>
      <input id="city" name="city" type="text" autocomplete="address-level2" placeholder="Berlin" required>
      <p id="located" class="located"></p>

      <fieldset>
        <legend>What to wear, by feels-like &deg;C</legend>

        <div id="bands" class="bands">
          <div class="band" data-band="jacket"><span class="band-name">jacket</span><span class="band-range" id="bandJacket"></span></div>
          <div class="band" data-band="pullover"><span class="band-name">pullover</span><span class="band-range" id="bandPullover"></span></div>
          <div class="band" data-band="shirt"><span class="band-name">shirt</span><span class="band-range" id="bandShirt"></span></div>
          <div class="handle" id="handleLow" role="slider" tabindex="0"
               aria-label="jacket below" aria-valuemin="-10" aria-valuemax="30"></div>
          <div class="handle" id="handleHigh" role="slider" tabindex="0"
               aria-label="pullover below" aria-valuemin="-10" aria-valuemax="30"></div>
        </div>
        <p class="hint">Drag the two dividers to set where each garment starts.</p>
      </fieldset>

      <div class="slider">
        <label for="rain">Rain streaks from <output id="rainOut" for="rain"></output></label>
        <input id="rain" name="rain" type="range" min="0" max="100" step="5" required>
      </div>

      <label for="refresh">Refresh interval</label>
      <select id="refresh" name="refresh" required>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
        <option value="120">120 min</option>
      </select>

      <button id="save" type="submit">Save</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
